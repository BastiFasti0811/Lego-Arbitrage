name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lego_arbitrage
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_arbitrage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test deploy script
        run: bash tests/deploy-prod.test.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://lego:lego_secret@localhost:5432/lego_arbitrage
          DATABASE_URL_SYNC: postgresql+psycopg://lego:lego_secret@localhost:5432/lego_arbitrage
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m compileall app
          python -m pytest
          python -m ruff check .
          # Mimic the prod image for the migration check: there `app` exists
          # only as a working-tree directory, never as an installed package,
          # and alembic runs as a console script (deploy-prod.sh, compose run).
          python -m pip uninstall --yes lego-arbitrage
          alembic upgrade head
          alembic check

      - name: Validate compose files
        run: |
          trap 'rm -f backend/.env' EXIT
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config > /dev/null

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "${PWD}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: ${{ vars.PROD_URL || 'http://178.104.97.121' }}

    steps:
      - name: Write production SSH key
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key

      - name: Pin production host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Hetzner server
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes "${{ vars.PROD_USER || 'deploy' }}@${{ vars.PROD_HOST || '178.104.97.121' }}" \
            "cd '${{ vars.PROD_APP_DIR || '/srv/lego-arbitrage' }}' && git pull --ff-only && bash scripts/deploy-prod.sh"
