name: CI

# Verify only. Production runs on victus (Sebastian's home machine) under
# /srv/lego-arbitrage, which GitHub-hosted runners cannot reach; the deploy is
# run locally after the merge, see docs/deploy.md#deploy. The former SSH deploy
# job targeted the retired Hetzner host 178.104.97.121 and was removed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# PR runs get their own group, so a new push cancels the stale verify; runs on
# main are never cancelled, every merge commit gets its own result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.pull_request.number) || format('verify-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lego_arbitrage
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_arbitrage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test deploy script
        run: bash tests/deploy-prod.test.sh

      - name: Test uptime check script
        run: bash tests/uptime-check.test.sh

      - name: Test post-deploy health check script
        run: bash tests/health-check-prod.test.sh

      - name: Test rollback script
        run: bash tests/rollback-prod.test.sh

      - name: Test backup script
        run: bash tests/backup-db.test.sh

      # The postgres:16-alpine image is already pulled for the service above,
      # so the probe's throwaway container starts without an extra download.
      - name: Test restore probe (real throwaway container)
        run: RESTORE_PROBE_DOCKER=1 bash tests/restore-probe.test.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://lego:lego_secret@localhost:5432/lego_arbitrage
          DATABASE_URL_SYNC: postgresql+psycopg://lego:lego_secret@localhost:5432/lego_arbitrage
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m compileall app
          python -m pytest
          python -m ruff check .
          # Mimic the prod image for the migration check: there `app` exists
          # only as a working-tree directory, never as an installed package,
          # and alembic runs as a console script (deploy-prod.sh, compose run).
          python -m pip uninstall --yes lego-arbitrage
          if python -m pip show --quiet lego-arbitrage; then
            echo "lego-arbitrage is still installed — prod-image mimicry is broken" >&2
            exit 1
          fi
          alembic upgrade head
          alembic check

      - name: Validate compose files
        run: |
          trap 'rm -f backend/.env' EXIT
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config > /dev/null

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -v "${PWD}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

